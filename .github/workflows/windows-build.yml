name: Jay AI Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Jay AI executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name JayAI --paths . app/main.py

      - name: Verify build and create ZIP package
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse
          if (-not (Test-Path "dist/JayAI/JayAI.exe")) {
            throw "Expected executable dist/JayAI/JayAI.exe was not created."
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = "release/JayAI-Windows.zip"
          Compress-Archive -Path "dist/JayAI/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  JayAI-Windows.zip" | Set-Content "release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows application folder
        uses: actions/upload-artifact@v4
        with:
          name: JayAI-Windows
          path: dist/JayAI/
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaged Windows ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: JayAI-Windows-Release-Package
          path: release/
          if-no-files-found: error
          retention-days: 30
