name: Jay AI Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Jay AI executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name JayAI --paths . app/main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JayAI-Windows
          path: dist/JayAI.exe
          if-no-files-found: error
