name: Jay AI Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Jay AI executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name JayAI --paths . app/main.py

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse
          if (-not (Test-Path "dist/JayAI/JayAI.exe")) {
            throw "Expected executable dist/JayAI/JayAI.exe was not created."
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: JayAI-Windows
          path: dist/JayAI/
          if-no-files-found: error
